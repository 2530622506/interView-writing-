<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Hooks 调用顺序与链表</title><desc id="desc">组件 Fiber 的 memoizedState 指向按调用顺序排列的 Hook 节点。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker><style>.b{rx:14;stroke-width:2}.h{font:700 22px system-ui;fill:#0f172a}.t{font:16px system-ui;fill:#334155}.l{stroke:#475569;stroke-width:3;marker-end:url(#a)}.bad{font:600 15px system-ui;fill:#b91c1c}</style></defs>
  <rect width="1120" height="430" fill="#fff"/>
  <text class="h" x="560" y="42" text-anchor="middle">一次渲染中的 Hook 槽位由调用顺序决定</text>
  <rect class="b" x="45" y="130" width="210" height="150" fill="#dbeafe" stroke="#3b82f6"/><text class="h" x="150" y="172" text-anchor="middle">Component Fiber</text><text class="t" x="75" y="215">memoizedState</text><text class="t" x="75" y="248">组件级状态入口</text>
  <rect class="b" x="330" y="105" width="190" height="200" fill="#ede9fe" stroke="#8b5cf6"/><text class="h" x="425" y="145" text-anchor="middle">Hook #1</text><text class="t" x="355" y="190">useState</text><text class="t" x="355" y="225">memoizedState</text><text class="t" x="355" y="260">queue → updates</text>
  <rect class="b" x="600" y="105" width="190" height="200" fill="#fef3c7" stroke="#f59e0b"/><text class="h" x="695" y="145" text-anchor="middle">Hook #2</text><text class="t" x="625" y="190">useReducer</text><text class="t" x="625" y="225">memoizedState</text><text class="t" x="625" y="260">queue → updates</text>
  <rect class="b" x="870" y="105" width="190" height="200" fill="#dcfce7" stroke="#22c55e"/><text class="h" x="965" y="145" text-anchor="middle">Hook #3</text><text class="t" x="895" y="190">useEffect</text><text class="t" x="895" y="225">create / deps</text><text class="t" x="895" y="260">effect list</text>
  <line class="l" x1="255" y1="205" x2="325" y2="205"/><line class="l" x1="520" y1="205" x2="595" y2="205"/><line class="l" x1="790" y1="205" x2="865" y2="205"/>
  <text class="bad" x="560" y="370" text-anchor="middle">条件分支改变调用顺序 → Hook #n 对不上旧节点 → 状态错位</text>
</svg>
