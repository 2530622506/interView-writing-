<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">浏览器多进程架构示意图</title>
  <desc id="desc">浏览器主进程、网络进程、渲染进程、GPU 进程和 Worker 的关系。</desc>
  <defs>
    <linearGradient id="browser" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e8f1ff"/><stop offset="1" stop-color="#cfe0ff"/></linearGradient>
    <linearGradient id="render" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e8fff5"/><stop offset="1" stop-color="#c8f4df"/></linearGradient>
    <linearGradient id="network" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff7e6"/><stop offset="1" stop-color="#ffe5ad"/></linearGradient>
    <linearGradient id="gpu" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4edff"/><stop offset="1" stop-color="#dfd0ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#5b6b82"/></marker>
  </defs>
  <rect width="1200" height="650" fill="#fbfcfe"/>
  <text x="60" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#1f2937">浏览器多进程架构：隔离故障，也隔离职责</text>
  <text x="60" y="92" font-family="sans-serif" font-size="16" fill="#667085">简化示意：不同浏览器版本的进程划分可能不同，但“职责分离 + IPC 通信”是理解重点。</text>
  <rect x="55" y="135" width="1090" height="465" rx="24" fill="white" stroke="#d9e2ef" stroke-width="2" filter="url(#shadow)"/>
  <rect x="85" y="170" width="230" height="125" rx="18" fill="url(#browser)" stroke="#82aaf0" stroke-width="2"/>
  <text x="110" y="210" font-family="sans-serif" font-size="22" font-weight="700" fill="#24518e">Browser 进程</text>
  <text x="110" y="242" font-family="sans-serif" font-size="15" fill="#3f5f88">窗口、标签页、地址栏</text>
  <text x="110" y="268" font-family="sans-serif" font-size="15" fill="#3f5f88">权限、生命周期、进程协调</text>
  <rect x="370" y="170" width="230" height="125" rx="18" fill="url(#network)" stroke="#e9ad43" stroke-width="2"/>
  <text x="395" y="210" font-family="sans-serif" font-size="22" font-weight="700" fill="#925d00">Network 进程</text>
  <text x="395" y="242" font-family="sans-serif" font-size="15" fill="#865d20">DNS、连接、HTTP 缓存</text>
  <text x="395" y="268" font-family="sans-serif" font-size="15" fill="#865d20">请求调度、响应分发</text>
  <rect x="655" y="160" width="265" height="180" rx="18" fill="url(#render)" stroke="#55b986" stroke-width="2"/>
  <text x="680" y="200" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b7650">Renderer 进程</text>
  <text x="680" y="232" font-family="sans-serif" font-size="15" fill="#287658">HTML 解析、DOM / CSSOM</text>
  <text x="680" y="258" font-family="sans-serif" font-size="15" fill="#287658">JavaScript、Layout、Paint</text>
  <text x="680" y="284" font-family="sans-serif" font-size="15" fill="#287658">通常按站点隔离页面</text>
  <rect x="680" y="302" width="205" height="23" rx="11" fill="#ffffff" opacity=".8"/>
  <text x="695" y="319" font-family="sans-serif" font-size="13" fill="#287658">主线程 / 合成线程 / Worker</text>
  <rect x="965" y="170" width="145" height="125" rx="18" fill="url(#gpu)" stroke="#9b7be0" stroke-width="2"/>
  <text x="990" y="210" font-family="sans-serif" font-size="22" font-weight="700" fill="#6846aa">GPU 进程</text>
  <text x="990" y="242" font-family="sans-serif" font-size="14" fill="#725ba1">纹理与图层</text>
  <text x="990" y="267" font-family="sans-serif" font-size="14" fill="#725ba1">合成与显示</text>
  <rect x="85" y="390" width="835" height="150" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="110" y="430" font-family="sans-serif" font-size="20" font-weight="700" fill="#334155">渲染进程内部的典型线程</text>
  <rect x="110" y="455" width="170" height="52" rx="12" fill="#dff7ea"/><text x="135" y="487" font-family="sans-serif" font-size="15" fill="#226c49">主线程：解析 / JS / 布局</text>
  <rect x="300" y="455" width="170" height="52" rx="12" fill="#e8f1ff"/><text x="327" y="487" font-family="sans-serif" font-size="15" fill="#315b95">合成线程：图层合成</text>
  <rect x="490" y="455" width="170" height="52" rx="12" fill="#fff0d1"/><text x="515" y="487" font-family="sans-serif" font-size="15" fill="#8a5b11">光栅线程：绘制位图</text>
  <rect x="680" y="455" width="200" height="52" rx="12" fill="#f1eaff"/><text x="715" y="487" font-family="sans-serif" font-size="15" fill="#6e4ca7">Dedicated Worker：计算任务</text>
  <path d="M315 232 C335 232 345 232 370 232" stroke="#5b6b82" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 232 C620 232 630 232 655 232" stroke="#5b6b82" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M920 232 C940 232 945 232 965 232" stroke="#5b6b82" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M775 340 C775 365 775 372 775 390" stroke="#5b6b82" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="326" y="216" font-family="sans-serif" font-size="13" fill="#64748b">IPC</text><text x="611" y="216" font-family="sans-serif" font-size="13" fill="#64748b">IPC</text><text x="931" y="216" font-family="sans-serif" font-size="13" fill="#64748b">图层提交</text><text x="730" y="372" font-family="sans-serif" font-size="13" fill="#64748b">进程内线程协作</text>
  <text x="970" y="470" font-family="sans-serif" font-size="14" fill="#475569">核心结论</text><text x="970" y="497" font-family="sans-serif" font-size="13" fill="#64748b">页面卡顿常见于</text><text x="970" y="518" font-family="sans-serif" font-size="13" fill="#64748b">Renderer 主线程</text><text x="970" y="539" font-family="sans-serif" font-size="13" fill="#64748b">被长任务占满。</text>
</svg>
