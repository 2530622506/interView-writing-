<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">React 列表 Diff 中 lastPlacedIndex 的直觉</title><desc id="desc">旧列表 A B C D 更新为 A C B E，通过旧索引是否小于 lastPlacedIndex 判断移动。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker><style>.h{font:700 22px system-ui;fill:#0f172a}.t{font:16px system-ui;fill:#334155}.n{rx:12;stroke-width:2}.l{stroke:#64748b;stroke-width:2;marker-end:url(#a)}.m{stroke:#ef4444;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="430" fill="#f8fafc"/><text class="h" x="550" y="45" text-anchor="middle">旧序列 A B C D → 新序列 A C B E</text>
  <text class="t" x="65" y="110">旧索引：</text><g fill="#dbeafe" stroke="#3b82f6"><rect class="n" x="170" y="75" width="130" height="70"/><rect class="n" x="355" y="75" width="130" height="70"/><rect class="n" x="540" y="75" width="130" height="70"/><rect class="n" x="725" y="75" width="130" height="70"/></g>
  <g class="h" text-anchor="middle"><text x="235" y="118">A · 0</text><text x="420" y="118">B · 1</text><text x="605" y="118">C · 2</text><text x="790" y="118">D · 3</text></g>
  <text class="t" x="65" y="315">新顺序：</text><g fill="#dcfce7" stroke="#22c55e"><rect class="n" x="170" y="280" width="130" height="70"/><rect class="n" x="355" y="280" width="130" height="70"/><rect class="n" x="540" y="280" width="130" height="70"/><rect class="n" x="725" y="280" width="130" height="70"/></g>
  <g class="h" text-anchor="middle"><text x="235" y="323">A</text><text x="420" y="323">C</text><text x="605" y="323">B</text><text x="790" y="323">E</text></g>
  <line class="l" x1="235" y1="145" x2="235" y2="275"/><line class="l" x1="605" y1="145" x2="420" y2="275"/><line class="m" x1="420" y1="145" x2="605" y2="275"/>
  <text class="t" x="880" y="220">C 先复用，lastPlacedIndex = 2</text><text class="t" x="880" y="250" fill="#b91c1c">B 的旧索引 1 &lt; 2，因此标记移动</text><text class="t" x="880" y="280">E 没有旧节点，因此插入</text>
</svg>
