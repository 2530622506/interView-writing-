<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc">
  <title id="title">React Element、Fiber 与 DOM 的关系</title>
  <desc id="desc">React Element 描述期望界面，Fiber 保存工作与状态，DOM 是最终宿主节点。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.box{rx:18;stroke-width:2}.h{font:700 24px system-ui;fill:#0f172a}.t{font:16px system-ui;fill:#334155}.s{font:14px system-ui;fill:#475569}.a{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.label{font:600 15px system-ui;fill:#0f172a}</style>
  </defs>
  <rect width="1080" height="480" fill="#f8fafc"/>
  <rect class="box" x="60" y="110" width="270" height="240" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="h" x="195" y="155" text-anchor="middle">React Element</text>
  <text class="t" x="90" y="200">• 不可变描述对象</text><text class="t" x="90" y="235">• type / key / props</text><text class="t" x="90" y="270">• 来自 JSX 的计算结果</text><text class="s" x="90" y="315">回答“想要什么界面”</text>
  <rect class="box" x="405" y="65" width="270" height="330" fill="#ede9fe" stroke="#8b5cf6"/>
  <text class="h" x="540" y="110" text-anchor="middle">Fiber</text>
  <text class="t" x="435" y="155">• 可变工作单元</text><text class="t" x="435" y="190">• 保存组件状态与 Hook</text><text class="t" x="435" y="225">• child / sibling / return</text><text class="t" x="435" y="260">• lanes / flags / alternate</text><text class="s" x="435" y="315">回答“如何完成更新”</text><text class="s" x="435" y="345">Render 阶段可重做</text>
  <rect class="box" x="750" y="110" width="270" height="240" fill="#dcfce7" stroke="#22c55e"/>
  <text class="h" x="885" y="155" text-anchor="middle">Host DOM</text>
  <text class="t" x="780" y="200">• 浏览器真实节点</text><text class="t" x="780" y="235">• 事件与布局载体</text><text class="t" x="780" y="270">• Commit 阶段被修改</text><text class="s" x="780" y="315">回答“页面最终是什么”</text>
  <line class="a" x1="330" y1="230" x2="400" y2="230"/><text class="label" x="365" y="210" text-anchor="middle">reconcile</text>
  <line class="a" x1="675" y1="230" x2="745" y2="230"/><text class="label" x="710" y="210" text-anchor="middle">commit</text>
</svg>
