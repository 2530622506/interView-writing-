<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">浏览器渲染流水线示意图</title>
  <desc id="desc">从 HTML 和 CSS 到 DOM、CSSOM、渲染树、布局、绘制和合成的流程。</desc>
  <defs>
    <linearGradient id="input" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e9f2ff"/><stop offset="1" stop-color="#c9ddff"/></linearGradient>
    <linearGradient id="process" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#e7fbf1"/><stop offset="1" stop-color="#c6f0da"/></linearGradient>
    <linearGradient id="output" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f2eaff"/><stop offset="1" stop-color="#dfd0ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1280" height="470" fill="#fbfcfe"/>
  <text x="55" y="52" font-family="sans-serif" font-size="28" font-weight="700" fill="#1f2937">渲染流水线：每一步都在回答一个不同问题</text>
  <text x="55" y="82" font-family="sans-serif" font-size="15" fill="#667085">结构是什么？样式是什么？放在哪里？画成什么？哪些图层可以直接合成？</text>
  <g filter="url(#shadow)"><rect x="55" y="140" width="145" height="110" rx="16" fill="url(#input)" stroke="#7ea8ed" stroke-width="2"/><rect x="235" y="140" width="145" height="110" rx="16" fill="url(#input)" stroke="#7ea8ed" stroke-width="2"/><rect x="415" y="140" width="145" height="110" rx="16" fill="url(#process)" stroke="#55b986" stroke-width="2"/><rect x="595" y="140" width="145" height="110" rx="16" fill="url(#process)" stroke="#55b986" stroke-width="2"/><rect x="775" y="140" width="145" height="110" rx="16" fill="url(#process)" stroke="#55b986" stroke-width="2"/><rect x="955" y="140" width="145" height="110" rx="16" fill="url(#process)" stroke="#55b986" stroke-width="2"/><rect x="1135" y="140" width="100" height="110" rx="16" fill="url(#output)" stroke="#9b7be0" stroke-width="2"/></g>
  <g font-family="sans-serif" text-anchor="middle"><text x="127" y="180" font-size="20" font-weight="700" fill="#24518e">HTML</text><text x="127" y="210" font-size="14" fill="#3f5f88">字节流 → DOM</text><text x="307" y="180" font-size="20" font-weight="700" fill="#24518e">CSS</text><text x="307" y="210" font-size="14" fill="#3f5f88">规则 → CSSOM</text><text x="487" y="180" font-size="20" font-weight="700" fill="#1b7650">Render Tree</text><text x="487" y="210" font-size="14" fill="#287658">可见节点 + 样式</text><text x="667" y="180" font-size="20" font-weight="700" fill="#1b7650">Layout</text><text x="667" y="210" font-size="14" fill="#287658">几何位置与尺寸</text><text x="847" y="180" font-size="20" font-weight="700" fill="#1b7650">Paint</text><text x="847" y="210" font-size="14" fill="#287658">记录绘制指令</text><text x="1027" y="180" font-size="20" font-weight="700" fill="#1b7650">Raster</text><text x="1027" y="210" font-size="14" fill="#287658">生成像素位图</text><text x="1185" y="180" font-size="20" font-weight="700" fill="#6846aa">Composite</text><text x="1185" y="210" font-size="14" fill="#725ba1">图层合成</text></g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M200 195 H235"/><path d="M380 195 H415"/><path d="M560 195 H595"/><path d="M740 195 H775"/><path d="M920 195 H955"/><path d="M1100 195 H1135"/></g>
  <rect x="120" y="310" width="1040" height="72" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/><text x="145" y="340" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">性能追问</text><text x="145" y="364" font-family="sans-serif" font-size="14" fill="#64748b">改变几何尺寸通常会触发 Layout；只改变颜色通常只需 Paint；只改变 transform / opacity 在满足条件时可以主要走 Composite。</text>
  <text x="55" y="430" font-family="sans-serif" font-size="14" fill="#64748b">注意：真实浏览器会增量更新、并行光栅化，并可能跳过某些步骤；上图是用于面试表达的主干模型。</text>
</svg>
