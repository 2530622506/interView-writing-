<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Chromium 浏览器多进程架构示意图</title>
  <desc id="desc">展示 Browser Process、Renderer Process、GPU/Viz Process、Network Service 与 Worker 之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" font-size="30" font-weight="700" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">以 Chromium 为例：一次页面背后不止一个进程</text>
  <text x="60" y="102" font-size="17" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">进程边界提供隔离；线程在进程内部承担导航、脚本、合成和光栅化等工作。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="145" width="500" height="190" rx="20" fill="#fff" stroke="#6366f1" stroke-width="3"/>
    <text x="88" y="184" font-size="24" font-weight="700" fill="#4338ca" font-family="sans-serif">Browser Process</text>
    <text x="88" y="216" font-size="17" fill="#334155" font-family="sans-serif">负责浏览器 UI、导航协调、权限与进程管理</text>
    <rect x="88" y="244" width="130" height="56" rx="12" fill="#eef2ff"/><text x="110" y="278" font-size="16" fill="#3730a3" font-family="sans-serif">UI Thread</text>
    <rect x="235" y="244" width="140" height="56" rx="12" fill="#eef2ff"/><text x="251" y="278" font-size="16" fill="#3730a3" font-family="sans-serif">Navigation</text>
    <rect x="392" y="244" width="140" height="56" rx="12" fill="#eef2ff"/><text x="415" y="278" font-size="16" fill="#3730a3" font-family="sans-serif">Storage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="145" width="500" height="310" rx="20" fill="#fff" stroke="#0ea5e9" stroke-width="3"/>
    <text x="668" y="184" font-size="24" font-weight="700" fill="#0369a1" font-family="sans-serif">Renderer Process</text>
    <text x="668" y="216" font-size="17" fill="#334155" font-family="sans-serif">把 HTML、CSS、JavaScript 变成可交互页面</text>
    <rect x="668" y="244" width="205" height="72" rx="14" fill="#e0f2fe"/>
    <text x="725" y="274" font-size="17" font-weight="700" fill="#075985" font-family="sans-serif">Main Thread</text>
    <text x="694" y="299" font-size="14" fill="#0c4a6e" font-family="sans-serif">解析 / JS / Style / Layout</text>
    <rect x="890" y="244" width="220" height="72" rx="14" fill="#e0f2fe"/>
    <text x="930" y="274" font-size="17" font-weight="700" fill="#075985" font-family="sans-serif">Compositor Thread</text>
    <text x="930" y="299" font-size="14" fill="#0c4a6e" font-family="sans-serif">合成 / 滚动 / 帧提交</text>
    <rect x="668" y="335" width="205" height="72" rx="14" fill="#e0f2fe"/>
    <text x="716" y="365" font-size="17" font-weight="700" fill="#075985" font-family="sans-serif">Raster Threads</text>
    <text x="713" y="390" font-size="14" fill="#0c4a6e" font-family="sans-serif">图块光栅化</text>
    <rect x="890" y="335" width="220" height="72" rx="14" fill="#e0f2fe"/>
    <text x="934" y="365" font-size="17" font-weight="700" fill="#075985" font-family="sans-serif">Worker Threads</text>
    <text x="938" y="390" font-size="14" fill="#0c4a6e" font-family="sans-serif">页面创建的 Worker</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="410" width="240" height="120" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="3"/>
    <text x="92" y="453" font-size="22" font-weight="700" fill="#b45309" font-family="sans-serif">Network Service</text>
    <text x="92" y="486" font-size="15" fill="#475569" font-family="sans-serif">DNS / 连接 / HTTP / Cache</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="330" y="410" width="230" height="120" rx="18" fill="#fff" stroke="#ec4899" stroke-width="3"/>
    <text x="381" y="453" font-size="22" font-weight="700" fill="#be185d" font-family="sans-serif">GPU / Viz</text>
    <text x="369" y="486" font-size="15" fill="#475569" font-family="sans-serif">聚合、光栅化与最终绘制</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="640" y="515" width="500" height="120" rx="18" fill="#fff" stroke="#10b981" stroke-width="3"/>
    <text x="670" y="556" font-size="22" font-weight="700" fill="#047857" font-family="sans-serif">Service Worker</text>
    <text x="670" y="590" font-size="16" fill="#475569" font-family="sans-serif">独立生命周期，可拦截受控范围内请求；不是 DOM 所在线程</text>
  </g>

  <path d="M560 225 C600 225,600 225,640 225" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M300 470 C470 470,520 350,640 300" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 470 C610 470,620 410,640 385" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M890 515 L890 455" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="672" font-size="14" fill="#64748b" font-family="sans-serif">注意：这是面试级简化图。Chromium 的实际服务与进程划分会随平台、站点隔离和版本变化。</text>
</svg>
