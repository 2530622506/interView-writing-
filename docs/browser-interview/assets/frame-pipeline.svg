<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">浏览器一帧工作流水线</title>
  <desc id="desc">展示输入、JavaScript、样式、布局、绘制和合成在一帧中的典型关系，并标出长任务会挤压渲染时间。</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <text x="55" y="62" font-size="30" font-weight="700" fill="#0f172a" font-family="sans-serif">一帧不是只有 JavaScript：主线程还要给渲染留时间</text>
  <text x="55" y="96" font-size="17" fill="#475569" font-family="sans-serif">刷新率为 60 Hz 时，一帧理论预算约 16.7 ms；实际可用预算还会被浏览器工作和设备差异压缩。</text>
  <g filter="url(#s)" font-family="sans-serif">
    <rect x="55" y="155" width="150" height="95" rx="16" fill="#dbeafe"/><text x="100" y="195" font-size="20" font-weight="700" fill="#1d4ed8">Input</text><text x="83" y="224" font-size="14" fill="#334155">事件分发</text>
    <rect x="230" y="155" width="180" height="95" rx="16" fill="#fef3c7"/><text x="272" y="195" font-size="20" font-weight="700" fill="#b45309">JavaScript</text><text x="265" y="224" font-size="14" fill="#334155">task / microtask</text>
    <rect x="435" y="155" width="145" height="95" rx="16" fill="#ede9fe"/><text x="477" y="195" font-size="20" font-weight="700" fill="#6d28d9">Style</text><text x="467" y="224" font-size="14" fill="#334155">样式计算</text>
    <rect x="605" y="155" width="145" height="95" rx="16" fill="#e0f2fe"/><text x="646" y="195" font-size="20" font-weight="700" fill="#0369a1">Layout</text><text x="641" y="224" font-size="14" fill="#334155">几何计算</text>
    <rect x="775" y="155" width="145" height="95" rx="16" fill="#fce7f3"/><text x="822" y="195" font-size="20" font-weight="700" fill="#be185d">Paint</text><text x="811" y="224" font-size="14" fill="#334155">生成绘制项</text>
    <rect x="945" y="155" width="190" height="95" rx="16" fill="#d1fae5"/><text x="984" y="195" font-size="20" font-weight="700" fill="#047857">Composite</text><text x="987" y="224" font-size="14" fill="#334155">合成并显示</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"><path d="M205 203h25"/><path d="M410 203h25"/><path d="M580 203h25"/><path d="M750 203h25"/><path d="M920 203h25"/></g>
  <text x="55" y="315" font-size="20" font-weight="700" fill="#0f172a" font-family="sans-serif">当 JavaScript 变成长任务：</text>
  <rect x="55" y="342" width="1080" height="66" rx="14" fill="#fee2e2"/>
  <rect x="55" y="342" width="835" height="66" rx="14" fill="#ef4444"/>
  <text x="80" y="382" font-size="17" font-weight="700" fill="#fff" font-family="sans-serif">Long Task 占住主线程，输入处理和下一次绘制只能等待</text>
  <text x="920" y="382" font-size="15" fill="#991b1b" font-family="sans-serif">掉帧 / INP 变差</text>
  <text x="55" y="467" font-size="15" fill="#64748b" font-family="sans-serif">这是一张理解模型，不代表所有浏览器每帧都严格按固定顺序执行全部步骤；没有样式变化时，对应阶段可以跳过。</text>
</svg>
