<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">DOM、CSSOM、Layout 与 Paint 关系图</title>
  <desc id="desc">展示 HTML 和 CSS 如何形成 DOM 与 CSSOM，并经过样式计算、布局、绘制和合成得到页面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#f0fdfa"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <text x="55" y="65" font-size="30" font-weight="700" fill="#0f172a" font-family="sans-serif">浏览器不是“直接把 DOM 画出来”</text>
  <text x="55" y="100" font-size="17" fill="#475569" font-family="sans-serif">每一步都会产生下一步需要的数据；改动落在哪一步，决定了更新成本。</text>
  <g filter="url(#s)" font-family="sans-serif">
    <rect x="55" y="155" width="180" height="90" rx="16" fill="#fff" stroke="#f97316" stroke-width="3"/><text x="105" y="192" font-size="22" font-weight="700" fill="#c2410c">HTML</text><text x="85" y="220" font-size="15" fill="#475569">标记与文档内容</text>
    <rect x="55" y="335" width="180" height="90" rx="16" fill="#fff" stroke="#14b8a6" stroke-width="3"/><text x="112" y="372" font-size="22" font-weight="700" fill="#0f766e">CSS</text><text x="86" y="400" font-size="15" fill="#475569">层叠与样式规则</text>
    <rect x="300" y="155" width="180" height="90" rx="16" fill="#fff" stroke="#f97316" stroke-width="3"/><text x="355" y="192" font-size="22" font-weight="700" fill="#c2410c">DOM</text><text x="325" y="220" font-size="15" fill="#475569">内容与节点关系</text>
    <rect x="300" y="335" width="180" height="90" rx="16" fill="#fff" stroke="#14b8a6" stroke-width="3"/><text x="342" y="372" font-size="22" font-weight="700" fill="#0f766e">CSSOM</text><text x="331" y="400" font-size="15" fill="#475569">可计算的样式规则</text>
    <rect x="545" y="245" width="190" height="100" rx="16" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><text x="582" y="285" font-size="21" font-weight="700" fill="#6d28d9">Style</text><text x="575" y="315" font-size="15" fill="#475569">为元素计算最终样式</text>
    <rect x="800" y="155" width="170" height="90" rx="16" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="845" y="192" font-size="21" font-weight="700" fill="#1d4ed8">Layout</text><text x="824" y="220" font-size="15" fill="#475569">尺寸与几何位置</text>
    <rect x="800" y="335" width="170" height="90" rx="16" fill="#fff" stroke="#ec4899" stroke-width="3"/><text x="850" y="372" font-size="21" font-weight="700" fill="#be185d">Paint</text><text x="826" y="400" font-size="15" fill="#475569">绘制指令与顺序</text>
    <rect x="1015" y="245" width="150" height="100" rx="16" fill="#fff" stroke="#10b981" stroke-width="3"/><text x="1037" y="285" font-size="20" font-weight="700" fill="#047857">Composite</text><text x="1038" y="315" font-size="14" fill="#475569">合成并提交帧</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)">
    <path d="M235 200H300"/><path d="M235 380H300"/>
    <path d="M480 200C520 200 515 270 545 280"/><path d="M480 380C520 380 515 320 545 310"/>
    <path d="M735 275C770 260 775 215 800 205"/><path d="M885 245V335"/><path d="M970 380C1000 380 995 315 1015 300"/>
  </g>
  <rect x="55" y="500" width="1110" height="82" rx="16" fill="#ffffffaa" stroke="#cbd5e1"/>
  <text x="80" y="535" font-size="16" fill="#334155" font-family="sans-serif">改文字颜色通常只需 Paint；改几何属性往往需要 Layout → Paint → Composite；只改可合成属性时可能绕过 Layout / Paint。</text>
  <text x="80" y="563" font-size="15" fill="#64748b" font-family="sans-serif">“一定触发什么”仍取决于属性、图层状态和浏览器实现，最终要用 DevTools 验证。</text>
</svg>
